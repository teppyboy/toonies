[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toonies-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "toonies-common",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
]

[project.scripts]
toonies-server = "toonies_server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toonies_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
