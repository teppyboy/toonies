[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toonies-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "toonies-common",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
]

[project.scripts]
toonies-server = "toonies_server.__main__:main"

[tool.uv.sources]
toonies-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/toonies_server"]
